input {
  file {
    path => "/data/kolekce2_airports_part1.csv"
    start_position => "beginning"
    sincedb_path => "/dev/null"
  }
}
filter {
  csv {
    separator => ","
    skip_header => true
    columns => ["IATA_CODE","AIRPORT","CITY","STATE","COUNTRY","LATITUDE","LONGITUDE"]
  }
  if [LATITUDE] and [LONGITUDE] {
    mutate {
      add_field => { "location" => "%{LATITUDE},%{LONGITUDE}" }
    }
  }
  mutate { remove_field => ["message", "host", "@timestamp", "path", "LATITUDE", "LONGITUDE"] }
}
output {
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    user => "logstash_internal"
    password => "${LOGSTASH_PASSWORD}"
    index => "airports-000001"
    manage_template => true
    template => "/usr/share/logstash/template/kolekce2.json"
    template_name => "airports_template"
  }
}