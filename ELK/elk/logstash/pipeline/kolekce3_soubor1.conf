input {
  file {
    path => "/data/kolekce3_airlines_part1.csv"
    start_position => "beginning"
    sincedb_path => "/dev/null"
  }
}
filter {
  csv {
    separator => ","
    skip_header => true
    columns => ["IATA_CODE","AIRLINE"]
  }
  mutate { remove_field => ["message", "host", "@timestamp", "path"] }
}
output {
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    user => "logstash_internal"
    password => "${LOGSTASH_PASSWORD}"
    index => "airlines-000001"
    manage_template => true
    template => "/usr/share/logstash/template/kolekce3.json"
    template_name => "airlines_template"
  }
}